<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>レシート読み取り・サンプル確認</title><style>body{font:16px/1.7 sans-serif;max-width:800px;margin:24px auto;padding:16px;background:#f7f4ed;color:#292d29}button{padding:14px;background:#526e55;color:white;border:0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:300px;width:100%}</style><h1>レシート読み取りのサンプル確認</h1><p>架空レシートだけをGoogle Geminiへ送ります。DBへの登録・変更は行いません。先に同じブラウザの本番アプリでログインしてください。認証情報は表示しません。</p><button id="run" disabled>サンプル画像で読み取り確認</button><p id="status" role="status">接続確認中…</p><pre id="result"></pre><img id="sample" src="receipt-sample.svg" alt="個人情報を含まない架空のレシート"><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://moorgivgwmkbxyjvwuih.supabase.co','sb_publishable_4cMwMgr654spcCXTKnsabw_a6AEu77x');
const button=document.getElementById('run'),status=document.getElementById('status'),result=document.getElementById('result');let household;
try{const {data:{session},error}=await db.auth.getSession();if(error||!session)throw Error('本番アプリでログインしてから再読み込みしてください。');const {data,error:hhError}=await db.from('households').select('id').order('created_at',{ascending:true});if(hhError||!data?.length)throw Error('世帯が見つかりません。');household=data[0].id;button.disabled=false;status.textContent='サンプルを送信できます（登録はしません）。';}catch(e){status.textContent=e.message;}
button.onclick=async()=>{button.disabled=true;result.textContent='';status.textContent='サンプルを読み取り中…';const started=performance.now();try{const image=document.getElementById('sample');await image.decode();const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1250;canvas.getContext('2d').drawImage(image,0,0);const encoded=canvas.toDataURL('image/jpeg',.85).split(',')[1];const {data,error}=await db.functions.invoke('scan-receipt',{body:{householdId:household,image:encoded,mimeType:'image/jpeg'}});if(error){let message=error.message;try{const body=await error.context.json();message=body.error||body.message||message;}catch{}throw Error(message);}status.textContent='完了・ブラウザからの合計 '+Math.round(performance.now()-started)+'ms';result.textContent=JSON.stringify({items:data.items,elapsedMs:data.elapsedMs,model:data.model,usage:data.usage},null,2);}catch(e){status.textContent='失敗：'+e.message;}finally{button.disabled=false;}};
</script></html>
