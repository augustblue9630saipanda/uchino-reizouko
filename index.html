<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うちの冷蔵庫</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f5f8f3;color:#284735}header{background:#ddf2e2;padding:28px 18px}main{max-width:650px;margin:auto;padding:16px}h1{margin:0}.card{background:white;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 3px 12px #183d2010}form{display:flex;gap:8px}input,button{font:inherit;padding:12px;border-radius:10px}input[type=text]{min-width:0;flex:1;border:1px solid #bcd1c2}button{border:0;background:#287c4b;color:white}ul{list-style:none;padding:0}li{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}li button{background:#e6f1e8;color:#285a3b}.tag{display:inline-block;background:#e7f3e8;padding:8px 12px;margin:4px;border-radius:20px}.note{font-size:13px;color:#667b6c}#preview{max-width:100%;max-height:220px;margin-top:10px}</style></head><body><header><main><h1>🥬 うちの冷蔵庫</h1><p>食材から今日のごはんを考えよう</p></main></header><main><section class="card"><h2>食材を追加</h2><form id="form"><input id="food" type="text" placeholder="例：たまご" required maxlength="50"><button type="submit">追加</button></form><p id="status" class="note"></p></section><section class="card"><h2>冷蔵庫の中身 <span id="count"></span></h2><ul id="items"></ul></section><section class="card"><h2>🍳 献立のヒント</h2><div id="menus"></div><p class="note">簡易提案です。必要な材料がすべて揃っているとは限りません。</p></section><section class="card"><h2>📷 写真で登録（準備中）</h2><input type="file" id="photo" accept="image/*" capture="environment"><img id="preview" hidden alt="選択した写真"><p class="note">写真プレビューのみ。食材自動認識は今後対応。</p></section><p class="note">試作版 v0.3｜夫婦共有・ログインは未対応。食材はこのブラウザに保存されます。</p></main><script>(function(){var key='uchino-reizouko-v3',items=[],$=function(id){return document.getElementById(id)};try{var saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))items=saved}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(items));$('status').textContent='保存しました'}catch(e){$('status').textContent='追加できましたが、この環境では保存できません'}}function render(){$('count').textContent='('+items.length+'品)';$('items').replaceChildren();if(!items.length){var p=document.createElement('p');p.textContent='食材を追加してみよう！';$('items').appendChild(p)}items.forEach(function(x,i){var li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button');s.textContent=x;b.textContent='削除';b.onclick=function(){items.splice(i,1);save();render()};li.append(s,b);$('items').appendChild(li)});var recipes=[['卵焼き',['たまご','卵']],['野菜炒め',['キャベツ','にんじん','豚肉']],['チャーハン',['ごはん','卵','たまご']],['カレー',['じゃがいも','玉ねぎ']],['味噌汁',['豆腐','わかめ']],['トマトサラダ',['トマト']]];var found=recipes.filter(function(r){return r[1].some(function(k){return items.some(function(x){return x.includes(k)})})});$('menus').replaceChildren();if(!found.length)$('menus').textContent='食材を追加すると候補が表示されます';found.forEach(function(r){var t=document.createElement('span');t.className='tag';t.textContent=r[0];$('menus').appendChild(t)})}$('form').addEventListener('submit',function(e){e.preventDefault();var x=$('food').value.trim();if(!x)return;if(!items.includes(x))items.push(x);$('food').value='';save();render()});$('photo').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$('preview').src=r.result;$('preview').hidden=false};r.readAsDataURL(f)});render()})();</script></body></html>
